spring.application.name=task-list

# Thymeleaf usa os templates de resources/templates e o cache fica desativado
# durante o desenvolvimento para refletir edições sem reiniciar a aplicação.
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# Textos da interface ficam separados dos templates.
spring.messages.basename=messages
spring.messages.encoding=UTF-8

# Banco H2 em arquivo (e não em memória): os cadastros continuam salvos
# na pasta data mesmo depois que a aplicação for encerrada.
spring.datasource.url=jdbc:h2:file:./data/task-list-db;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# O Hibernate cria/atualiza a tabela a partir da entidade JPA.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Console para inspecionar o H2 durante o desenvolvimento.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
